services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: folly
      POSTGRES_PASSWORD: folly
      POSTGRES_DB: folly
    ports:
      # Host port for Postgres. If you change DB_PORT, use the same port in
      # DATABASE_URL so the host-run API (npm run dev / dev:api) can connect.
      - "${DB_PORT:-5440}:5432"
    volumes:
      - folly_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U folly -d folly"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://folly:folly@db:5432/folly
      PORT: "3001"
      SEED_DEMO: "true"
    ports:
      - "3001:3001"

volumes:
  folly_pg: